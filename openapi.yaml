openapi: 3.0.3
info:
  title: Blog API
  version: 1.0.0
  description: >-
    REST API for blog posts, comments, and user authentication. The API uses
    PostgreSQL with Prisma, JWT authentication, and role-based authorization.
servers:
  - url: http://localhost:3000
    description: Local development server
  - url: https://blog-api-65st.onrender.com
    description: Production server
tags:
  - name: Auth
    description: Authentication, session management, and account creation endpoints
  - name: Posts
    description: Blog post listing and management endpoints
  - name: Comments
    description: Comment management and retrieval endpoints
paths:
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      description: >-
        Creates a new account with a unique username and email address. The
        password is validated, hashed with bcrypt, and stored securely.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              username: john_doe
              email: john@example.com
              password: secret123
      responses:
        '201':
          description: User registered successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Created
        '409':
          description: The request conflicts with an existing resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Username or email is already taken
        '422':
          description: The request parameters, query, body, or file failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Validation failed
                errors:
                  - message: Username must be at least 3 characters
                    path: username
        '500':
          description: An unexpected server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Something went wrong!

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Log in and receive JWT credentials
      description: >-
        Verifies user credentials, returns an access token in the response body,
        and sets an HttpOnly refresh token cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: john_doe
              password: secret123
      responses:
        '200':
          description: Authentication succeeded. Returns access token and sets refresh token cookie.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Sets the HttpOnly refreshToken cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              example:
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        '401':
          description: Authentication failed due to incorrect credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Username or password is incorrect
        '422':
          description: The request parameters, query, body, or file failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Validation failed
                errors:
                  - message: Password must be at least 8 characters
                    path: password
        '500':
          description: An unexpected server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Something went wrong!

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Get current authenticated user
      description: >-
        Returns profile details of the currently authenticated user based on the
        provided Bearer JWT token.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
              example:
                id: 1
                username: john_doe
                email: john@example.com
                role: USER
        '401':
          description: Authentication failed or token is missing, invalid, or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Token not found or invalid format
        '404':
          description: The requested user was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: User not found
        '500':
          description: An unexpected server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Something went wrong!

  /api/auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      description: >-
        Generates a new access token and rotates the refresh token using the
        HttpOnly `refreshToken` cookie.
      parameters:
        - name: refreshToken
          in: cookie
          required: true
          description: HttpOnly refresh token cookie.
          schema:
            type: string
      responses:
        '200':
          description: Access token refreshed successfully.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Rotates the HttpOnly refreshToken cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              example:
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        '401':
          description: Refresh token is missing, invalid, expired, or counterfeit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Invalid or expired token
        '500':
          description: An unexpected server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Something went wrong!

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Log out user
      description: >-
        Invalidates the active refresh token in the database and clears the
        HttpOnly `refreshToken` cookie.
      parameters:
        - name: refreshToken
          in: cookie
          required: false
          description: HttpOnly refresh token cookie to invalidate.
          schema:
            type: string
      responses:
        '200':
          description: Logged out successfully.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Clears the refreshToken cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Successfully logged out
        '500':
          description: An unexpected server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Something went wrong!

  /api/posts:
    get:
      tags: [Posts]
      summary: List posts
      description: >-
        Returns paginated posts ordered by creation date descending. Anonymous
        and non-admin users only receive PUBLISHED posts. Authenticated admin
        users can filter by post state.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: state
          in: query
          required: false
          description: >-
            Optional post state filter. Non-admin users are always limited to
            PUBLISHED posts even if another state is provided.
          schema:
            $ref: '#/components/schemas/PostState'
        - name: search
          in: query
          required: false
          description: Search text applied to post title, content, and description (case-insensitive).
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Number of posts to return per page. Defaults to 10.
          schema:
            type: integer
            minimum: 1
            default: 10
        - name: page
          in: query
          required: false
          description: Page number for pagination. Defaults to 1.
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        '200':
          description: A paginated list of posts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostsListResponse'
        '401':
          description: Authentication failed or token is invalid or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Invalid or expired token
        '422':
          description: The request parameters, query, body, or file failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Validation failed
                errors:
                  - message: Must be one of (PUBLISHED, HIDDEN, DRAFT)
                    path: state
        '500':
          description: An unexpected server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Something went wrong!
    post:
      tags: [Posts]
      summary: Create a new post
      description: >-
        Creates a new post with a cover image file upload. Content and description
        are required if state is PUBLISHED or HIDDEN. Restricted to users with the
        ADMIN role.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreatePostRequest'
      responses:
        '201':
          description: Post created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          description: The request parameters or payload are invalid or missing required data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: File wasn't sent
        '401':
          description: Authentication failed or token is missing, invalid, or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Token not found or invalid format
        '403':
          description: The authenticated user is not authorized to access or modify this resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: 'Forbidden: Admin access required'
        '422':
          description: The request parameters, query, body, or file failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Validation failed
                errors:
                  - message: Title must be at least 5 characters
                    path: title
        '500':
          description: An unexpected server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Something went wrong!

  /api/posts/{postId}:
    get:
      tags: [Posts]
      summary: Get a post by id
      description: >-
        Returns a single post with its latest 10 comments. Public requests can
        read PUBLISHED posts. DRAFT or HIDDEN posts require an ADMIN token.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: postId
          in: path
          required: true
          description: Numeric post identifier.
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: The requested post and its latest comments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostWithCommentsResponse'
        '401':
          description: Authentication failed or token is invalid or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Invalid or expired token
        '403':
          description: The authenticated user is not authorized to access this post.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: 'Forbidden: Admin access required'
        '404':
          description: The requested resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Post not found
        '422':
          description: The request parameters, query, body, or file failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Validation failed
                errors:
                  - message: Must be positive
                    path: postId
        '500':
          description: An unexpected server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Something went wrong!
    put:
      tags: [Posts]
      summary: Update a post
      description: >-
        Updates post fields. If updating to PUBLISHED or HIDDEN (or updating an
        already published/hidden post), content and description must not be empty.
        Restricted to users with the ADMIN or EDITOR role.
      security:
        - bearerAuth: []
      parameters:
        - name: postId
          in: path
          required: true
          description: Numeric post identifier.
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePostRequest'
            example:
              title: Updated post title
              description: Updated short summary.
              content: Updated content
              state: PUBLISHED
      responses:
        '200':
          description: Post updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '401':
          description: Authentication failed or token is missing, invalid, or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Token not found or invalid format
        '403':
          description: The authenticated user is not authorized to access or modify this resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: 'Forbidden: Admin or editor access required'
        '404':
          description: The requested resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Post not found
        '422':
          description: The request parameters, query, body, or file failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Content is required for publishing posts
        '500':
          description: An unexpected server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Something went wrong!
    delete:
      tags: [Posts]
      summary: Delete a post
      description: >-
        Deletes a post by id. Restricted to users with the ADMIN role.
      security:
        - bearerAuth: []
      parameters:
        - name: postId
          in: path
          required: true
          description: Numeric post identifier.
          schema:
            type: integer
            minimum: 1
      responses:
        '204':
          description: Post deleted successfully. No response body is returned.
        '401':
          description: Authentication failed or token is missing, invalid, or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Token not found or invalid format
        '403':
          description: The authenticated user is not authorized to access or modify this resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: 'Forbidden: Admin access required'
        '404':
          description: The requested resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Post not found
        '422':
          description: The request parameters, query, body, or file failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Validation failed
                errors:
                  - message: Must be positive
                    path: postId
        '500':
          description: An unexpected server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Something went wrong!

  /api/posts/{postId}/likes:
    post:
      tags: [Posts]
      summary: Toggle like on a post
      description: >-
        Likes or unlikes a post for the authenticated user. If already liked, the
        like is removed and returns 'Unliked'; otherwise, a like is created and
        returns 'Liked'.
      security:
        - bearerAuth: []
      parameters:
        - name: postId
          in: path
          required: true
          description: Numeric post identifier.
          schema:
            type: integer
            minimum: 1
      responses:
        '201':
          description: Like status toggled successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LikeToggleResponse'
              example:
                message: Liked
        '401':
          description: Authentication failed or token is missing, invalid, or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Token not found or invalid format
        '404':
          description: The requested post was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Post not found
        '422':
          description: The request parameters, query, body, or file failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Validation failed
                errors:
                  - message: Must be positive
                    path: postId
        '500':
          description: An unexpected server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Something went wrong!

  /api/posts/{postId}/comments:
    get:
      tags: [Comments]
      summary: List comments for a post
      description: >-
        Returns a paginated list of comments for the specified post. Public
        requests can read comments only for PUBLISHED posts. DRAFT or HIDDEN
        posts require an ADMIN token.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: postId
          in: path
          required: true
          description: Numeric post identifier.
          schema:
            type: integer
            minimum: 1
        - name: search
          in: query
          required: false
          description: Search text applied to comment content (case-insensitive).
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Number of comments to return per page. Defaults to 10.
          schema:
            type: integer
            minimum: 1
            default: 10
        - name: page
          in: query
          required: false
          description: Page number for pagination. Defaults to 1.
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        '200':
          description: A paginated list of comments for the post.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentsListResponse'
        '401':
          description: Authentication failed or token is invalid or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Invalid or expired token
        '403':
          description: The authenticated user is not authorized to access comments for this post.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: 'Forbidden: Admin access required'
        '404':
          description: The requested resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Post not found
        '422':
          description: The request parameters, query, body, or file failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Validation failed
                errors:
                  - message: Must be positive
                    path: postId
        '500':
          description: An unexpected server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Something went wrong!
    post:
      tags: [Comments]
      summary: Create a comment for a post
      description: >-
        Creates a new comment for the specified post. Authentication is required.
      security:
        - bearerAuth: []
      parameters:
        - name: postId
          in: path
          required: true
          description: Numeric post identifier.
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'
            example:
              content: Nice post!
      responses:
        '200':
          description: Comment created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '401':
          description: Authentication failed or token is missing, invalid, or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Token not found or invalid format
        '404':
          description: The requested resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Post not found
        '422':
          description: The request parameters, query, body, or file failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Validation failed
                errors:
                  - message: Content is required
                    path: content
        '500':
          description: An unexpected server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Something went wrong!

  /api/comments/{commentId}:
    get:
      tags: [Comments]
      summary: Get a comment by id
      description: >-
        Returns a single comment if the parent post is published. Comments on
        hidden or draft posts are not accessible via this endpoint.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: commentId
          in: path
          required: true
          description: Numeric comment identifier.
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: The requested comment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentWithDetails'
        '401':
          description: Authentication failed or token is invalid or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Invalid or expired token
        '404':
          description: The requested resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Comment not found
        '422':
          description: The request parameters, query, body, or file failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Validation failed
                errors:
                  - message: Must be positive
                    path: commentId
        '500':
          description: An unexpected server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Something went wrong!
    put:
      tags: [Comments]
      summary: Update a comment
      description: >-
        Updates comment text. Restricted to the author of the comment or an
        ADMIN user.
      security:
        - bearerAuth: []
      parameters:
        - name: commentId
          in: path
          required: true
          description: Numeric comment identifier.
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCommentRequest'
            example:
              content: Updated comment text
      responses:
        '200':
          description: Comment updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '401':
          description: Authentication failed or token is missing, invalid, or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Token not found or invalid format
        '403':
          description: The authenticated user is not authorized to access or modify this resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: "You don't have access to update this comment"
        '404':
          description: The requested resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Comment not found
        '422':
          description: The request parameters, query, body, or file failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Validation failed
                errors:
                  - message: Not a string
                    path: content
        '500':
          description: An unexpected server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Something went wrong!
    delete:
      tags: [Comments]
      summary: Delete a comment
      description: >-
        Deletes a comment by id. Restricted to the author of the comment or an
        ADMIN user.
      security:
        - bearerAuth: []
      parameters:
        - name: commentId
          in: path
          required: true
          description: Numeric comment identifier.
          schema:
            type: integer
            minimum: 1
      responses:
        '204':
          description: Comment deleted successfully. No response body is returned.
        '401':
          description: Authentication failed or token is missing, invalid, or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Token not found or invalid format
        '403':
          description: The authenticated user is not authorized to access or modify this resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: "You don't have access to delete this comment"
        '404':
          description: The requested resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Comment not found
        '422':
          description: The request parameters, query, body, or file failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Validation failed
                errors:
                  - message: Must be positive
                    path: commentId
        '500':
          description: An unexpected server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Something went wrong!

  /api/comments/{commentId}/likes:
    post:
      tags: [Comments]
      summary: Toggle like on a comment
      description: >-
        Likes or unlikes a comment for the authenticated user. If already liked,
        the like is removed and returns 'Unliked'; otherwise, a like is created
        and returns 'Liked'.
      security:
        - bearerAuth: []
      parameters:
        - name: commentId
          in: path
          required: true
          description: Numeric comment identifier.
          schema:
            type: integer
            minimum: 1
      responses:
        '201':
          description: Like status toggled successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LikeToggleResponse'
              example:
                message: Liked
        '401':
          description: Authentication failed or token is missing, invalid, or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Token not found or invalid format
        '404':
          description: The requested comment was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Comment not found
        '422':
          description: The request parameters, query, body, or file failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Validation failed
                errors:
                  - message: Must be positive
                    path: commentId
        '500':
          description: An unexpected server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Something went wrong!

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Provide the JWT returned by the login or refresh endpoints in the
        Authorization header as `Bearer <token>`.

  schemas:
    Role:
      type: string
      enum: [USER, EDITOR, ADMIN]
      description: User role used for authorization checks.

    PostState:
      type: string
      enum: [DRAFT, PUBLISHED, HIDDEN]
      description: Post visibility and publication state.

    MessageResponse:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
          description: Status message returned by the operation.

    LikeToggleResponse:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
          enum: [Liked, Unliked]
          description: Status message indicating whether the resource was liked or unliked.

    TokenResponse:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          description: Signed JWT access token that should be sent in the Authorization header.

    RegisterRequest:
      type: object
      additionalProperties: false
      required: [username, email, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
          pattern: '^[a-zA-Z0-9_-]+$'
          description: Unique username using letters, numbers, underscores, or hyphens.
        email:
          type: string
          format: email
          maxLength: 255
          description: Unique email address for the new account.
        password:
          type: string
          minLength: 8
          maxLength: 120
          description: Account password that will be hashed before storage.

    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
          pattern: '^[a-zA-Z0-9_-]+$'
          description: Username used to authenticate the user.
        password:
          type: string
          minLength: 8
          maxLength: 120
          description: Password associated with the account.

    UserResponse:
      type: object
      additionalProperties: false
      required: [id, username, email, role]
      properties:
        id:
          type: integer
          format: int32
          description: Unique user identifier.
        username:
          type: string
          description: Unique username.
        email:
          type: string
          format: email
          description: Unique email address.
        role:
          $ref: '#/components/schemas/Role'

    CreatePostRequest:
      type: object
      required: [postImage]
      properties:
        title:
          type: string
          minLength: 5
          maxLength: 255
          default: Untitled
          description: Post title. Defaults to "Untitled" if empty or omitted.
        description:
          type: string
          maxLength: 300
          description: Post summary. Required when publishing the post.
        content:
          type: string
          description: Post body content. Required when publishing the post.
        state:
          allOf:
            - $ref: '#/components/schemas/PostState'
          default: DRAFT
        postImage:
          type: string
          format: binary
          description: Post cover image file (JPEG, PNG, or WEBP, max 5 MB).

    UpdatePostRequest:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 5
          maxLength: 255
          description: Updated post title.
        description:
          type: string
          maxLength: 300
          description: Updated post summary. Required when publishing.
        content:
          type: string
          description: Updated post content. Required when publishing.
        state:
          $ref: '#/components/schemas/PostState'

    Post:
      type: object
      additionalProperties: false
      required: [id, title, createdAt, updatedAt, userId, state, coverImageKey, thumbnailKey]
      properties:
        id:
          type: integer
          format: int32
          description: Unique post identifier.
        title:
          type: string
          description: Post title.
        content:
          type: string
          nullable: true
          description: Optional post content.
        description:
          type: string
          nullable: true
          description: Optional post description.
        coverImageKey:
          type: string
          description: Object key of the post cover image stored in cloud storage.
        thumbnailKey:
          type: string
          description: Object key of the post thumbnail image stored in cloud storage.
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp.
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp.
        userId:
          type: integer
          format: int32
          description: Identifier of the authoring user.
        state:
          $ref: '#/components/schemas/PostState'

    PostWithDetails:
      allOf:
        - $ref: '#/components/schemas/Post'
        - type: object
          required: [coverImageUrl, thumbnailUrl, likesCount, isLiked]
          properties:
            coverImageUrl:
              type: string
              description: Public URL to access the post cover image.
            thumbnailUrl:
              type: string
              description: Public URL to access the post thumbnail image.
            likesCount:
              type: integer
              description: Total number of likes on the post.
            isLiked:
              type: boolean
              description: Whether the authenticated user has liked this post.

    PostWithCommentsResponse:
      allOf:
        - $ref: '#/components/schemas/PostWithDetails'
        - type: object
          required: [comments]
          properties:
            comments:
              type: array
              description: Latest comments attached to the post (up to 10).
              items:
                $ref: '#/components/schemas/Comment'

    PostsListResponse:
      type: object
      additionalProperties: false
      required: [data, totalCount, currentPage, pageSize]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PostWithDetails'
        totalCount:
          type: integer
          description: Total number of posts matching the filter criteria.
        currentPage:
          type: integer
          description: Current page number.
        pageSize:
          type: integer
          description: Number of posts per page.

    CreateCommentRequest:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 400
          description: Comment text.

    UpdateCommentRequest:
      type: object
      additionalProperties: false
      properties:
        content:
          type: string
          description: Updated comment text.

    Comment:
      type: object
      additionalProperties: false
      required: [id, content, createdAt, updatedAt, userId, postId]
      properties:
        id:
          type: integer
          format: int32
          description: Unique comment identifier.
        content:
          type: string
          description: Comment text.
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp.
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp.
        userId:
          type: integer
          format: int32
          description: Identifier of the commenting user.
        postId:
          type: integer
          format: int32
          description: Identifier of the parent post.

    CommentWithDetails:
      allOf:
        - $ref: '#/components/schemas/Comment'
        - type: object
          required: [likesCount, isLiked]
          properties:
            likesCount:
              type: integer
              description: Total number of likes on the comment.
            isLiked:
              type: boolean
              description: Whether the authenticated user has liked this comment.

    CommentAuthor:
      type: object
      additionalProperties: false
      required: [username]
      properties:
        username:
          type: string
          description: Username of the comment author.

    CommentWithAuthorAndDetails:
      allOf:
        - $ref: '#/components/schemas/CommentWithDetails'
        - type: object
          required: [user]
          properties:
            user:
              $ref: '#/components/schemas/CommentAuthor'

    CommentsListResponse:
      type: object
      additionalProperties: false
      required: [data, totalCount, currentPage, pageSize]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CommentWithAuthorAndDetails'
        totalCount:
          type: integer
          description: Total number of comments for the post.
        currentPage:
          type: integer
          description: Current page number.
        pageSize:
          type: integer
          description: Number of comments per page.

    ErrorDetail:
      type: object
      additionalProperties: false
      required: [message, path]
      properties:
        message:
          type: string
          description: Human-readable validation message.
        path:
          type: string
          description: Field path that failed validation.

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
          description: Error message returned by the API.
        errors:
          type: array
          description: Validation errors when request validation fails.
          items:
            $ref: '#/components/schemas/ErrorDetail'
